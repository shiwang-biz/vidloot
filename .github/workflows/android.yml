name: Build Vidloot Android

# Builds the Android APKs on every push to main that touches android/, and
# attaches them to the GitHub Release named after the app version
# (versionName in android/app/build.gradle.kts, e.g. android-v1.0.0).

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    env:
      VIDLOOT_LICENSE_API: ${{ vars.LICENSE_API_URL }}
      VIDLOOT_LICENSE_PUBKEY: ${{ vars.LICENSE_PUBLIC_KEY }}
      VIDLOOT_LICENSE_KID: ${{ vars.LICENSE_KEY_ID }}
      VIDLOOT_LICENSE_PRODUCT: ${{ vars.LICENSE_PRODUCT }}
      VIDLOOT_LICENSE_PRODUCT_ANDROID: ${{ vars.LICENSE_PRODUCT_ANDROID }}
    defaults:
      run: { working-directory: android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.14.3' }

      - name: Unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/vidloot.jks"
            echo "VL_KEYSTORE=$RUNNER_TEMP/vidloot.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret: APKs are signed with a temporary debug key (fine for testing only)."
          fi

      - name: Build APKs
        env:
          VL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Name the APKs
        id: v
        run: |
          V=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$V" >> "$GITHUB_OUTPUT"
          mkdir -p ../dist
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" .apk | sed 's/^app-//; s/-release$//')
            cp "$f" "../dist/Vidloot-$V-android-$n.apk"
          done
          ls -lh ../dist

      - uses: actions/upload-artifact@v4
        with:
          name: vidloot-android
          path: dist/*.apk

      - name: Release note
        if: vars.LICENSE_API_URL == '' || vars.LICENSE_PUBLIC_KEY == ''
        run: echo "::warning::LICENSE_API_URL / LICENSE_PUBLIC_KEY repository variables are not set, so this build has no licensing and is not published as a release (APKs are in the run's artifacts)."
      - uses: softprops/action-gh-release@v2
        if: vars.LICENSE_API_URL != '' && vars.LICENSE_PUBLIC_KEY != ''
        with:
          tag_name: android-v${{ steps.v.outputs.version }}
          name: Vidloot Android ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Most phones: **Vidloot-${{ steps.v.outputs.version }}-android-arm64-v8a.apk**.
            Not sure? Use the **universal** APK (bigger, works on every phone).
          files: dist/*.apk
