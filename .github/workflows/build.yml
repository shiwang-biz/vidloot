name: Build Vidloot

# Builds the Windows installer and the macOS app (one universal .dmg for
# Apple Silicon and Intel) on every push to main, and publishes them as a
# GitHub Release named after the version in src-tauri/tauri.conf.json
# (e.g. v1.0.0). Bump the version to make a new release.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md']

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: npm install
      - run: node scripts/fetch-sidecars.mjs x86_64-pc-windows-msvc
      - run: npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: vidloot-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: 'aarch64-apple-darwin,x86_64-apple-darwin' }
      - uses: swatinem/rust-cache@v2
        with: { workspaces: src-tauri }
      - run: brew install nasm pkg-config
      - name: Restore FFmpeg build
        id: ffcache
        uses: actions/cache/restore@v4
        with:
          path: .ffmpeg-build
          key: ffmpeg-macos-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}
      - run: bash scripts/build-ffmpeg-macos.sh
      - name: Save FFmpeg build (even if a later step fails)
        if: steps.ffcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ffmpeg-build
          key: ffmpeg-macos-${{ hashFiles('scripts/build-ffmpeg-macos.sh') }}
      - run: npm install
      - run: node scripts/fetch-sidecars.mjs universal-apple-darwin
      - name: Build app
        run: |
          # With no signing secrets set, build an ad-hoc signed app instead of failing.
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          npx tauri build --target universal-apple-darwin
        env:
          # Optional: Developer ID signing + notarization. Without these the app
          # still builds; users right-click → Open the first time.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - uses: actions/upload-artifact@v4
        with:
          name: vidloot-macos
          path: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg

  release:
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(jq -r .version src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Vidloot ${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/**/*
