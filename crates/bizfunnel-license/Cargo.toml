[package]
name = "bizfunnel-license"
version = "1.0.0"
edition = "2021"
description = "License client for Bizfunnel License Manager: device activation, Ed25519-verified offline licenses, updates. For Tauri and any Rust desktop app."
license = "Proprietary"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ed25519-dalek = "2"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
rand = "0.8"
thiserror = "1"
machine-uid = "0.5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tempfile = "3"
